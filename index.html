<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة أسعار الكيك والمقاسات - المخبز</title>
  <style>
    :root {
      --primary: #e85d04;
      --bg: #fff8f0;
      --card-bg: #ffffff;
      --text: #2b2d42;
      --border: #f1dca7;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 520px;
      width: 100%;
      background: var(--card-bg);
      padding: 24px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
      color: #9d0208;
      margin-top: 0;
      font-size: 1.4rem;
    }

    .notice {
      background: #fff3bf;
      color: #856404;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid #ffe066;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1rem;
      outline: none;
      background: #fff;
      box-sizing: border-box;
    }

    .extras-section {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #eee;
      margin-top: 15px;
      max-height: 220px;
      overflow-y: auto;
    }

    .extra-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .extra-item input[type="checkbox"] {
      transform: scale(1.2);
      margin-left: 8px;
    }

    .result-card {
      background: #fdf0ed;
      border: 2px dashed var(--primary);
      border-radius: 16px;
      padding: 16px;
      margin-top: 20px;
      text-align: center;
    }

    .price {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary);
      margin: 8px 0;
    }

    .details {
      font-size: 0.9rem;
      color: #555;
      line-height: 1.5;
    }

    .btn-whatsapp {
      display: block;
      width: 100%;
      background: #25d366;
      color: white;
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 16px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🎂 حاسبة أسعار الكيك والإضافات</h2>
  <div class="notice">⚠️ الأسعار مبدئية وتختلف حسب الشكل والتصميم المطلوب</div>

  <div class="form-group">
    <label for="sizeSelect">اختر مقاس الكيك الأساسي:</label>
    <select id="sizeSelect" onchange="calculate()">
      <option value="15cm">مقاس 15 سم (دائري) - 60 ر.س</option>
      <option value="20cm">مقاس 20 سم (دائري) - 80 ر.س</option>
      <option value="25cm">مقاس 25 سم (دائري) - 110 ر.س</option>
      <option value="30x40">مقاس 30 × 40 سم (مستطيل) - 230 ر.س</option>
      <option value="40x60">مقاس 40 × 60 سم (مستطيل) - 345 ر.س</option>
    </select>
  </div>

  <label>الإضافات والإكسسوارات الاختيارية:</label>
  <div class="extras-section" id="extrasList">
    <!-- سيتم تعبئة الإضافات بالبرمجة أو يدوياً -->
    <div class="extra-item"><label><input type="checkbox" value="60" data-name="صورة"> صورة (60 ر.س)</label></div>
    <div class="extra-item"><label><input type="checkbox" value="20" data-name="غرسة"> غرسة (20 ر.س)</label></div>
    <div class="extra-item"><label><input type="checkbox" value="5" data-name="غرسة رقم صغير"> غرسة رقم صغير (5 ر.س)</label></div>
    <div class="extra-item"><label><input type="checkbox" value="10" data-name="غرسة رقم كبيرة"> غرسة رقم كبيرة (10 ر.س)</label></div>
    <div class="extra-item"><label><input type="checkbox" value="10" data-name="قبعة تخرج"> قبعة تخرج (10 ر.س)</label></div>
    <div class="extra-item"><label><input type="checkbox" value="40" data-name="دمية صغيرة"> دمية صغيرة (40 ر.س)</label></div>
    <div class="extra-item"><label><input type="checkbox" value="100" data-name="دمية كبيرة"> دمية كبيرة (100 ر.س)</label></div>
    <div class="extra-item"><label><input type="checkbox" value="30" data-name="ورق ذهب"> ورق ذهب (30 ر.س)</label></div>
    <div class="extra-item"><label><input type="checkbox" value="60" data-name="ورد طبيعي"> ورد طبيعي (60 ر.س)</label></div>
    <div class="extra-item"><label><input type="checkbox" value="25" data-name="ورد صغير"> ورد صغير (25 ر.س)</label></div>
    <div class="extra-item"><label><input type="checkbox" value="3" data-name="ورد صناعي صغير"> ورد صناعي صغير (3 ر.س)</label></div>
    <div class="extra-item"><label><input type="checkbox" value="6" data-name="ورد صناعي كبير"> ورد صناعي كبير (6 ر.س)</label></div>
    <div class="extra-item"><label><input type="checkbox" value="50" data-name="فواكه داخل الكيكة"> فواكه داخل الكيكة (50 ر.س)</label></div>
    <div class="extra-item"><label><input type="checkbox" value="30" data-name="فواكه تزيين"> فواكه تزيين علبة (30 ر.س)</label></div>
    <div class="extra-item"><label><input type="checkbox" value="75" data-name="حشوات / فستق ومكسرات"> حشوات أو مكسرات كيلو (75 ر.س)</label></div>
    <div class="extra-item"><label><input type="checkbox" value="80" data-name="عجينة سكر"> عجينة سكر (80 ر.س)</label></div>
    <div class="extra-item"><label><input type="checkbox" value="25" data-name="قاعدة سميكة"> قاعدة سميكة (25 ر.س)</label></div>
  </div>

  <div class="result-card">
    <div class="price" id="totalPrice">60 ر.س</div>
    <div class="details" id="selectedSummary">الكيك الأساسي فقط</div>
  </div>

  <a id="waLink" href="#" target="_blank" class="btn-whatsapp">اطلب الحين عبر الواتساب 💬</a>
</div>

<script>
  const cakeData = {
    '15cm': { name: 'مقاس 15 سم', price: 60 },
    '20cm': { name: 'مقاس 20 سم', price: 80 },
    '25cm': { name: 'مقاس 25 سم', price: 110 },
    '30x40': { name: 'مقاس 30 × 40 سم', price: 230 },
    '40x60': { name: 'مقاس 40 × 60 سم', price: 345 }
  };

  const myPhoneNumber = "966138631010";

  // ربط حدث التغيير لكل مربعات الإضافات
  document.querySelectorAll('#extrasList input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', calculate);
  });

  function calculate() {
    const sizeKey = document.getElementById('sizeSelect').value;
    const selectedCake = cakeData[sizeKey];
    
    let total = selectedCake.price;
    let extrasText = [];

    document.querySelectorAll('#extrasList input[type="checkbox"]:checked').forEach(cb => {
      total += parseInt(cb.value);
      extrasText.push(cb.getAttribute('data-name'));
    });

    document.getElementById('totalPrice').innerText = `${total} ر.س`;
    
    let summary = `المقاس: ${selectedCake.name}`;
    if (extrasText.length > 0) {
      summary += ` + الإضافات: ${extrasText.join(', ')}`;
    }
    document.getElementById('selectedSummary').innerText = summary;

    const msg = `مرحباً، حابب أطلب كيكة:\n- ${summary}\n- السعر الإجمالي الإجمالي: ${total} ر.س`;
    document.getElementById('waLink').href = `https://api.whatsapp.com/send?phone=${myPhoneNumber}&text=${encodeURIComponent(msg)}`;
  }

  calculate();
</script>

</body>
</html>
