<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة أسعار الكيك</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff8f0;
      color: #2b2d42;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 450px;
      width: 100%;
      background: #ffffff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border: 1px solid #f1dca7;
      box-sizing: border-box;
    }
    h2 {
      text-align: center;
      color: #9d0208;
      margin-top: 0;
    }
    .notice {
      background: #fff3bf;
      color: #856404;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    select, input[type="number"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      background: #fff;
      box-sizing: border-box;
    }
    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff9f5;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #ffd8a8;
      margin-bottom: 12px;
    }
    .extras-box {
      background: #fafafa;
      border: 1px solid #eee;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .extra-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }
    .result-card {
      background: #fff5f0;
      border: 2px dashed #e85d04;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      text-align: center;
    }
    .price {
      font-size: 1.8rem;
      font-weight: bold;
      color: #e85d04;
      margin: 5px 0;
    }
    .btn-whatsapp {
      display: block;
      width: 100%;
      background: #25d366;
      color: white;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 15px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🎂 حاسبة أسعار الكيك</h2>
  <div class="notice">⚠️ الأسعار مبدئية وتختلف حسب التصميم</div>

  <div class="form-group">
    <label>اختر المقاس:</label>
    <select id="sizeSelect" onchange="calculate()">
      <option value="lunch">لانش بوكس (~8 سم) - 40 ر.س</option>
      <option value="5inch">5 إنش (~13 سم) - 65 ر.س</option>
      <option value="6inch">6 إنش (~15 سم) - 75 ر.س</option>
      <option value="8inch">8 إنش (~20 سم) - 90 ر.س</option>
      <option value="10inch">10 إنش (~25 سم) - 127 ر.س</option>
      <option value="20x20">مستطيل / مربع 20 × 20 سم - 127 ر.س</option>
      <option value="30x40">مستطيل 30 × 40 سم - 230 ر.س</option>
      <option value="40x60">مستطيل 40 × 60 سم - 350 ر.س</option>
    </select>
  </div>

  <div class="toggle-group">
    <span>⬆️ كيكة مرتفعة (مضاعفة ×2)</span>
    <input type="checkbox" id="doubleToggle" onchange="calculate()" style="transform: scale(1.3);">
  </div>

  <div class="toggle-group">
    <span>📸 طباعة صورة على الكيك</span>
    <input type="checkbox" id="photoToggle" onchange="calculate()" style="transform: scale(1.3);">
  </div>

  <label>الإضافات والمجسمات:</label>
  <div class="extras-box">
    <div class="extra-item">
      <label><input type="checkbox" class="extra-cb" value="45" data-name="مجسم صغير" onchange="calculate()"> 🧸 مجسم صغير</label>
      <span>+45 ر.س</span>
    </div>
    <div class="extra-item">
      <label><input type="checkbox" class="extra-cb" value="100" data-name="مجسم كبير" onchange="calculate()"> 🗿 مجسم كبير</label>
      <span>+100 ر.س</span>
    </div>
    <div class="extra-item">
      <label><input type="checkbox" class="extra-cb" value="35" data-name="قبعة تخرج" onchange="calculate()"> 🎓 قبعة تخرج</label>
      <span>+35 ر.س</span>
    </div>
    <div class="extra-item" style="flex-direction: column; align-items: flex-start; gap: 5px;">
      <label style="display:flex; align-items:center; gap:5px;">
        <input type="checkbox" id="sugarToggle" onchange="calculate()"> 🍬 عجينة سكر (الكيلو بـ 80 ر.س)
      </label>
      <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 5px;">
        <span style="font-size: 0.85rem; color: #666;">الكمية (كيلو):</span>
        <input type="number" id="sugarQty" value="1" min="1" max="10" oninput="calculate()" style="width: 70px; padding: 4px; text-align: center;">
      </div>
    </div>
  </div>

  <div class="result-card">
    <div id="servings" style="font-size: 0.9rem; color: #555;">التفاصيل</div>
    <div class="price" id="totalPrice">40 ر.س</div>
  </div>

  <a id="waLink" href="#" target="_blank" class="btn-whatsapp">اطلب الحين عبر الواتساب 💬</a>
</div>
