<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة أسعار الكيك</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff8f0;
      color: #2b2d42;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 450px;
      width: 100%;
      background: #ffffff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border: 1px solid #f1dca7;
      box-sizing: border-box;
    }
    h2 {
      text-align: center;
      color: #9d0208;
      margin-top: 0;
    }
    .notice {
      background: #fff3bf;
      color: #856404;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      background: #fff;
      box-sizing: border-box;
    }
    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff9f5;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #ffd8a8;
      margin-bottom: 12px;
    }
    .extras-box {
      background: #fafafa;
      border: 1px solid #eee;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .extra-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    .result-card {
      background: #fff5f0;
      border: 2px dashed #e85d04;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      text-align: center;
    }
    .price {
      font-size: 1.8rem;
      font-weight: bold;
      color: #e85d04;
      margin: 5px 0;
    }
    .btn-whatsapp {
      display: block;
      width: 100%;
      background: #25d366;
      color: white;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 15px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🎂 حاسبة أسعار الكيك</h2>
  <div class="notice">⚠️ الأسعار مبدئية وتختلف حسب التصميم</div>

  <div class="form-group">
    <label>اختر المقاس:</label>
    <select id="sizeSelect" onchange="calculate()">
      <option value="lunch">لانش بوكس (~8 سم) - 40 ر.س</option>
      <option value="5inch">5 إنش (~13 سم) - 65 ر.س</option>
      <option value="6inch">6 إنش (~15 سم) - 75 ر.س</option>
      <option value="8inch">8 إنش (~20 سم) - 90 ر.س</option>
      <option value="10inch">10 إنش (~25 سم) - 127 ر.س</option>
    </select>
  </div>

  <div class="toggle-group">
    <span>⬆️ كيكة مرتفعة (مضاعفة ×2)</span>
    <input type="checkbox" id="doubleToggle" onchange="calculate()" style="transform: scale(1.3);">
  </div>

  <div class="toggle-group">
    <span>📸 طباعة صورة على الكيك</span>
    <input type="checkbox" id="photoToggle" onchange="calculate()" style="transform: scale(1.3);">
  </div>

  <label>الإضافات والمجسمات:</label>
  <div class="extras-box">
    <div class="extra-item">
      <label><input type="checkbox" class="extra-cb" value="45" data-name="مجسم صغير" onchange="calculate()"> 🧸 مجسم صغير</label>
      <span>+45 ر.س</span>
    </div>
    <div class="extra-item">
      <label><input type="checkbox" class="extra-cb" value="100" data-name="مجسم كبير" onchange="calculate()"> 🗿 مجسم كبير</label>
      <span>+100 ر.س</span>
    </div>
    <div class="extra-item">
      <label><input type="checkbox" class="extra-cb" value="35" data-name="قبعة تخرج" onchange="calculate()"> 🎓 قبعة تخرج</label>
      <span>+35 ر.س</span>
    </div>
  </div>

  <div class="result-card">
    <div id="servings" style="font-size: 0.9rem; color: #555;">التفاصيل</div>
    <div class="price" id="totalPrice">40 ر.س</div>
  </div>

  <a id="waLink" href="#" target="_blank" class="btn-whatsapp">اطلب الحين عبر الواتساب 💬</a>
</div>

<script>
  const data = {
    'lunch': { base: 40, photo: 70, name: 'لانش بوكس' },
    '5inch': { base: 65, photo: 110, name: '5 إنش' },
    '6inch': { base: 75, photo: 135, name: '6 إنش' },
    '8inch': { base: 90, photo: 150, name: '8 إنش' },
    '10inch': { base: 127, photo: 185, name: '10 إنش' }
  };

  const myPhoneNumber = "966138631010";

  function calculate() {
    const sizeKey = document.getElementById('sizeSelect').value;
    const isDouble = document.getElementById('doubleToggle').checked;
    const hasPhoto = document.getElementById('photoToggle').checked;
    const item = data[sizeKey];

    let basePrice = hasPhoto ? item.photo : item.base;
    if (isDouble) {
      basePrice = basePrice * 2;
    }

    let extrasCost = 0;
    let extrasList = [];
    document.querySelectorAll('.extra-cb:checked').forEach(cb => {
      extrasCost += parseInt(cb.value);
      extrasList.push(cb.getAttribute('data-name'));
    });

    const finalPrice = basePrice + extrasCost;

    let heightText = isDouble ? "مرتفعة طابقين" : "ارتفاع عادي";
    let photoText = hasPhoto ? "مع صورة" : "بدون صورة";
    let extrasText = extrasList.length > 0 ? " + إضافات: " + extrasList.join(', ') : "";

    document.getElementById('totalPrice').innerText = finalPrice + " ر.س";
    document.getElementById('servings').innerText = "المقاس: " + item.name + " (" + heightText + ")";

    const msg = "مرحباً، حابب أطلب كيك مقاس " + item.name + " [" + heightText + " - " + photoText + "]" + extrasText + " - السعر الإجمالي: " + finalPrice + " ر.س 🎂";
    document.getElementById('waLink').href = "https://api.whatsapp.com/send?phone=" + myPhoneNumber + "&text=" + encodeURIComponent(msg);
  }

  calculate();
</script>

</body>
</html>
