<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة أسعار الكيك والمقاسات</title>
  <style>
    :root {
      --primary: #e85d04;
      --bg: #fff8f0;
      --card-bg: #ffffff;
      --text: #2b2d42;
      --border: #f1dca7;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 480px;
      width: 100%;
      background: var(--card-bg);
      padding: 24px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
      color: #9d0208;
      margin-top: 0;
      font-size: 1.4rem;
    }

    .notice {
      background: #fff3bf;
      color: #856404;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid #ffe066;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 1rem;
      outline: none;
      background: #fff;
    }

    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8f9fa;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #eee;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(24px); }

    .result-card {
      background: #fdf0ed;
      border: 2px dashed var(--primary);
      border-radius: 16px;
      padding: 16px;
      margin-top: 20px;
      text-align: center;
    }

    .price {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary);
      margin: 10px 0;
    }

    .details {
      font-size: 0.9rem;
      color: #555;
      line-height: 1.6;
    }
