<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة أسعار الكيك والمقاسات 🎂</title>
  <style>
    :root {
      --primary: #e85d04;
      --primary-hover: #dc2f02;
      --bg: #fff8f0;
      --card-bg: #ffffff;
      --text: #2b2d42;
      --border: #f1dca7;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 480px;
      width: 100%;
      background: var(--card-bg);
      padding: 24px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(232, 93, 4, 0.08);
      border: 1px solid var(--border);
      box-sizing: border-box;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      text-align: center;
      color: #9d0208;
      margin-top: 0;
      font-size: 1.5rem;
    }

    .notice {
      background: #fff3bf;
      color: #856404;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid #ffe066;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: #374151;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 2px solid #e5e7eb;
      font-size: 1rem;
      outline: none;
      background: #fff;
      transition: all 0.3s;
      box-sizing: border-box;
    }

    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(232, 93, 4, 0.15);
    }

    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff9f5;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #ffd8a8;
      margin-bottom: 12px;
    }

    .extras-box {
      background: #fafafa;
      border: 1px solid #eee;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    .extra-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .extra-item:last-child {
      margin-bottom: 0;
    }

    .extra-item label {
      margin-bottom: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .extra-item input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(24px); }

    .result-card {
      background: linear-gradient(135deg, #fff5f0 0%, #ffe8dc 100%);
      border: 2px dashed var(--primary);
      border-radius: 16px;
      padding: 18px;
      margin-top: 20px;
      text-align: center;
    }

    .price {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary);
      margin: 8px 0;
    }

    .details {
      font-size: 0.95rem;
      color: #4b5563;
      line-height: 1.6;
    }

    .btn-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #25d366;
      color: white;
      text-align: center;
      padding: 14px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.05rem;
      margin-top: 20px;
      box-sizing: border-box;
      box-shadow: 0 4px 12px
